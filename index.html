<!doctype html><html lang="cs"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src https://fesvutrdfduoyqljxsuz.supabase.co wss://fesvutrdfduoyqljxsuz.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin"><title>El-Morrel — TEST</title>
<link rel="icon" href="assets/icons/favicon.png"><link rel="stylesheet" href="css/planner.css">
<script defer src="vendor/supabase-2.116.0.js"></script><script type="module" src="js/planner.js?v=test-connection-2"></script>
</head><body>
<header><div class="brand"><img src="assets/logo/logo.png" alt="El-Morrel"><h1>Plánovač — TEST</h1></div>
<form id="loginBox" class="actions"><label>E-mail<input id="loginEmail" type="email" autocomplete="username" required></label><label>Heslo<input id="loginPassword" type="password" autocomplete="current-password" required></label><button type="submit">Přihlásit</button><button type="button" class="secondary" data-action="reset">Zapomenuté heslo</button></form>
<div class="actions"><span id="currentUser"></span><button type="button" id="logout" data-action="logout" hidden>Odhlásit</button></div></header>
<p id="status" role="status" aria-live="polite"></p>
<div id="workspace" hidden><nav class="toolbar" aria-label="Ovládání plánu">
<button type="button" data-action="edit" data-table="jobs" data-editor>+ Zakázka</button><button type="button" data-action="edit" data-table="workers" data-editor>+ Pracovník</button><button type="button" data-action="edit" data-table="vehicles" data-editor>+ Vozidlo</button>
<button type="button" class="secondary" data-action="previous">← Týden</button><button type="button" class="secondary" data-action="today">Dnes</button><button type="button" class="secondary" data-action="next">Týden →</button><strong id="weekLabel"></strong><button type="button" class="secondary" data-action="refresh">Obnovit</button><button type="button" class="secondary" data-action="export">Úplný export</button><button type="button" class="secondary" data-action="import" data-editor>Sloučit import</button><input id="importFile" type="file" accept="application/json,.json" hidden></nav>
<div class="layout"><aside>
<label>Zobrazit<select id="listMode"><option value="jobs">Zakázky</option><option value="workers">Pracovníci</option><option value="vehicles">Vozidla</option></select></label>
<label>Hledat zakázku<input id="search" type="search" placeholder="Název, adresa, kontakt…"></label>
<label>Filtr zakázek<select id="jobFilter"><option value="active">Aktivní</option><option value="all">Všechny</option><option value="archive">Archiv</option><option value="to_invoice">Čeká na fakturaci</option><option value="overrun">Přetažený odhad</option></select></label><div id="items"></div></aside>
<main><label class="view-label">Plán podle<select id="viewMode"><option value="workers">Pracovníků</option><option value="vehicles">Vozidel</option></select></label><div id="board"></div></main></div></div>
<dialog id="editor" aria-labelledby="dialogTitle"><form id="editForm"><h2 id="dialogTitle"></h2><p id="editWarning" class="error" role="alert"></p><fieldset id="fields" class="form-grid"></fieldset><div class="dialog-actions"><div id="extraActions" class="actions"></div><button type="button" class="secondary" data-action="close">Zavřít</button><button id="saveButton" type="submit">Uložit</button></div></form></dialog>
<dialog id="passwordDialog" aria-labelledby="passwordTitle"><h2 id="passwordTitle">Nové heslo</h2><label>Heslo (alespoň 12 znaků)<input id="newPassword" type="password" autocomplete="new-password" minlength="12"></label><button type="button" data-action="password">Uložit heslo</button></dialog>
</body></html>
